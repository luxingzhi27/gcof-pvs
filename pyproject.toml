[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcof-pvs"
version = "0.1.0"
description = "Training and evaluation for GCOF-PVS"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.17.1",
    "torch>=2.5.1,<3",
    "tqdm>=4.66,<5",
]

[project.scripts]
gcof-train = "gcof_pvs.training.cli:main"
gcof-synthetic = "gcof_pvs.data.synthetic.cli:main"
gcof-eval = "gcof_pvs.evaluation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"gcof_pvs.data" = ["directions.json", "scene_registry.json"]
